<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NaldoA Music</title>
    
    <!-- PWA Manifest & Icons referencing local icon.png -->
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22NaldoA%20Music%22%2C%22short_name%22%3A%22NaldoA%20Music%22%2C%22start_url%22%3A%22%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23030305%22%2C%22theme_color%22%3A%22%23030305%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22icon.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%2C%22purpose%22%3A%22any maskable%22%7D%2C%7B%22src%22%3A%22icon.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%2C%22purpose%22%3A%22any maskable%22%7D%5D%7D">
    <meta name="theme-color" content="#030305">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NaldoA Music">

    <link rel="icon" type="image/png" href="icon.png" onerror="this.href='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=128&auto=format&fit=crop'">
    <link rel="apple-touch-icon" href="icon.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030305;
            color: #f8fafc;
            user-select: none;
            overflow: hidden;
            touch-action: pan-y;
            margin: 0;
            padding: 0;
            height: 100vh;
            height: 100svh;
            width: 100vw;
        }
        .feed-container {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: 100vh;
            height: 100svh;
            width: 100%;
            scroll-behavior: smooth;
        }
        .feed-card {
            scroll-snap-align: start;
            scroll-snap-stop: always;
            height: 100vh;
            height: 100svh;
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        ::-webkit-scrollbar { display: none; }

        @keyframes bounce-up {
            0%, 100% { transform: translateY(0); opacity: 0.6; }
            50% { transform: translateY(-8px); opacity: 1; }
        }
        .animate-bounce-up {
            animation: bounce-up 1.8s infinite ease-in-out;
        }
    </style>
</head>
<body class="h-[100svh] w-screen flex flex-col items-center justify-between relative bg-slate-950 overflow-hidden">

    <div id="welcome-overlay" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center transition-opacity duration-500">
        <div class="w-20 h-20 rounded-2xl overflow-hidden border-2 border-cyan-400 shadow-2xl mb-4 bg-slate-900">
            <img src="icon.png" alt="Logo" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=200&auto=format&fit=crop'">
        </div>
        <h1 class="text-2xl font-black text-white mb-2">Bem-vindo ao NaldoA Music</h1>
        <p class="text-xs text-slate-300 max-w-xs mb-6">Toque no botão abaixo para iniciar sua experiência musical imersiva oficial.</p>
        <button onclick="dismissWelcome()" class="px-8 py-4 bg-gradient-to-r from-cyan-500 to-fuchsia-600 hover:opacity-90 text-white rounded-2xl font-black text-sm shadow-2xl transition transform hover:scale-105 flex items-center space-x-2">
            <i class="fa-solid fa-play text-base"></i>
            <span>Iniciar / Tocar Agora</span>
        </button>
    </div>

    <header class="absolute top-0 left-0 right-0 w-full px-4 pt-[calc(env(safe-area-inset-top)+12px)] pb-3 flex items-center justify-between z-40 bg-gradient-to-b from-black/80 via-black/40 to-transparent pointer-events-auto">
        <div class="flex items-center space-x-2.5">
            <div class="w-9 h-9 rounded-xl overflow-hidden shadow-xl border border-cyan-400/40 flex-shrink-0 bg-slate-900">
                <img src="icon.png" alt="NaldoA Logo" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=200&auto=format&fit=crop'">
            </div>
            <div class="truncate leading-tight">
                <h1 class="font-black text-xs tracking-wide text-white truncate block drop-shadow-md">NaldoA Music</h1>
                <a href="https://naldoa-dm.web.app" target="_blank" class="text-[9px] text-cyan-300 font-semibold hover:underline block truncate drop-shadow-md">naldoa-dm.web.app</a>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openYouTubeTab()" title="YouTube Music Web" class="w-8 h-8 rounded-xl bg-red-600 hover:bg-red-700 text-white flex items-center justify-center transition shadow-lg text-xs" style="background-color: #ff0000;">
                <i class="fa-brands fa-youtube"></i>
            </button>
            <button onclick="shuffleTracks()" title="Aleatório" class="w-8 h-8 rounded-xl bg-black/50 backdrop-blur-md hover:bg-black/80 text-indigo-200 border border-white/20 flex items-center justify-center transition shadow-lg text-xs">
                <i class="fa-solid fa-shuffle"></i>
            </button>
            <button onclick="openLocalManagerModal()" title="Minhas Músicas Offline" class="px-3 h-8 bg-gradient-to-r from-cyan-500 to-fuchsia-600 hover:opacity-90 text-white rounded-xl text-[11px] font-bold shadow-lg transition flex items-center space-x-1.5">
                <i class="fa-solid fa-cloud-arrow-down text-[10px]"></i>
                <span>Minhas Músicas</span>
            </button>
        </div>
    </header>

    <main id="feed-root" class="feed-container w-full bg-slate-950 relative shadow-2xl overflow-y-scroll flex-1" 
          onmousedown="startDrag(event)" onmousemove="onDrag(event)" onmouseup="endDrag()" onmouseleave="endDrag()"
          ontouchstart="startTouch(event)" ontouchend="endTouch()">
        <div class="w-full h-full flex flex-col items-center justify-center space-y-4 text-slate-400 p-6 text-center">
            <i class="fa-solid fa-compact-disc fa-spin text-5xl text-cyan-400"></i>
            <p class="text-sm font-semibold tracking-wide">Carregando acervo oficial...</p>
        </div>
    </main>

    <div id="toast-notification" class="fixed top-24 left-1/2 transform -translate-x-1/2 z-50 bg-slate-900/95 backdrop-blur-md border border-cyan-500/50 text-white px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-bold flex items-center space-x-2.5 transition-all duration-300 opacity-0 pointer-events-none">
        <i class="fa-solid fa-circle-check text-cyan-400 text-base"></i>
        <span id="toast-message">Link copiado com sucesso!</span>
    </div>

    <div id="comments-modal" class="fixed inset-0 z-50 bg-black/85 hidden items-end sm:items-center justify-center">
        <div class="bg-slate-900 w-full max-w-md sm:max-w-sm max-h-[80vh] rounded-t-3xl sm:rounded-2xl p-5 flex flex-col space-y-4 border border-white/20 shadow-2xl overflow-hidden">
            <div class="flex items-center justify-between border-b border-white/15 pb-3">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-comments text-cyan-400 text-lg"></i>
                    <h2 class="text-sm font-bold text-white">Comentários da Faixa</h2>
                </div>
                <button onclick="closeCommentsModal()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center text-xs">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto space-y-2.5 pr-1 max-h-60" id="comments-list-container"></div>
            <div class="flex items-center space-x-2 pt-2 border-t border-white/15">
                <input type="text" id="comment-input" placeholder="Escreva seu comentário..." class="flex-1 bg-white/5 border border-white/20 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-cyan-400">
                <button onclick="submitNewComment()" class="px-4 py-2 bg-gradient-to-r from-cyan-500 to-fuchsia-600 hover:opacity-90 text-white rounded-xl text-xs font-bold shadow transition">
                    Enviar
                </button>
            </div>
        </div>
    </div>

    <div id="local-manager-modal" class="fixed inset-0 z-50 bg-black/85 hidden items-center justify-center p-4">
        <div class="bg-slate-900 w-full max-w-md max-h-[85vh] rounded-2xl p-5 flex flex-col space-y-4 border border-white/20 shadow-2xl overflow-hidden">
            <div class="flex items-center justify-between border-b border-white/15 pb-3">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 rounded-lg overflow-hidden border border-cyan-500/50 bg-slate-950">
                        <img src="icon.png" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=100&auto=format&fit=crop'">
                    </div>
                    <h2 class="text-sm font-bold text-white">Minhas Músicas Offline</h2>
                </div>
                <button onclick="closeLocalManagerModal()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center text-xs">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="grid grid-cols-2 gap-2 bg-slate-950 p-1 rounded-xl border border-white/10">
                <button id="tab-archive" onclick="switchModalTab('archive')" class="py-2 rounded-lg text-xs font-bold transition bg-cyan-600 text-white shadow">
                    NaldoA Music (<span id="count-archive">0</span>)
                </button>
                <button id="tab-local" onclick="switchModalTab('local')" class="py-2 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white">
                    Locais (<span id="count-local">0</span>)
                </button>
            </div>

            <div id="upload-section" class="hidden flex-col space-y-2">
                <label class="w-full py-3 px-4 bg-gradient-to-r from-cyan-500 to-fuchsia-600 hover:opacity-90 text-white rounded-xl text-xs font-bold cursor-pointer shadow-lg transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-folder-open text-sm"></i>
                    <span>Selecionar Músicas (Salva Offline)</span>
                    <input type="file" accept="audio/*,.mp3,.wav,.flac,.m4a,.aac,.ogg,.wma" multiple onchange="handleDeviceAudioUpload(event)" class="hidden">
                </label>
            </div>

            <div class="flex-1 overflow-y-auto space-y-2 pr-1 max-h-[50vh]" id="modal-tracks-list"></div>
        </div>
    </div>

    <audio id="global-audio" preload="auto" playsinline></audio>

    <script>
        const ARCHIVE_IDENTIFIER = 'naldoa-digital-music-stream';
        let archiveTracks = [];
        let localTracks = JSON.parse(localStorage.getItem('naldoa_local_tracks_offline')) || [];
        let tracks = [];
        let commentsDb = JSON.parse(localStorage.getItem('naldoa_archive_comments')) || {};
        let likesDb = JSON.parse(localStorage.getItem('naldoa_archive_likes')) || {};
        let currentPlayingIndex = -1;
        let activeCommentTrackId = null;
        let currentModalTab = 'archive';
        let audioEl = null;

        let isDragging = false;
        let startY = 0;
        let touchStartY = 0;

        function dismissWelcome() {
            const overlay = document.getElementById('welcome-overlay');
            if (overlay) {
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.display = 'none';
                    if (tracks.length > 0 && audioEl && audioEl.paused) {
                        audioEl.play().catch(e => console.log('Autoplay guard:', e));
                    }
                }, 500);
            }
        }

        function openYouTubeTab() {
            // Abre o YouTube Music oficial em uma nova aba/guia para tocar em segundo plano livre de bloqueios de iframe
            window.open('https://music.youtube.com', '_blank');
            if (audioEl && !audioEl.paused) audioEl.pause();
        }

        function startDrag(e) { isDragging = true; startY = e.clientY; }
        function onDrag(e) {
            if (!isDragging) return;
            const deltaY = e.clientY - startY;
            if (Math.abs(deltaY) > 70) {
                if (deltaY < 0) playNextTrack();
                else playPrevTrack();
                isDragging = false;
            }
        }
        function endDrag() { isDragging = false; }
        function startTouch(e) { if (e.touches && e.touches.length > 0) touchStartY = e.touches[0].clientY; }
        function endTouch() {}

        window.onload = async function() {
            audioEl = document.getElementById('global-audio');
            audioEl.onended = () => playNextTrack();

            audioEl.ontimeupdate = () => {
                if (!audioEl.duration) return;
                const percent = (audioEl.currentTime / audioEl.duration) * 100;
                tracks.forEach((_, idx) => {
                    const progressBar = document.getElementById(`progress-bar-${idx}`);
                    const progressTime = document.getElementById(`progress-time-${idx}`);
                    if (idx === currentPlayingIndex) {
                        if (progressBar) progressBar.style.width = percent + '%';
                        if (progressTime) progressTime.innerText = formatTime(audioEl.currentTime) + ' / ' + formatTime(audioEl.duration);
                    }
                });
            };

            await fetchArchiveData();
        };

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        function showToast(message) {
            const toast = document.getElementById('toast-notification');
            const msgEl = document.getElementById('toast-message');
            msgEl.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        function cleanTrackTitleAndAlbum(fileNameBase) {
            let cleanTitle = fileNameBase;
            let albumName = 'NaldoA Music';

            const styleRegex = /_?(gospel|reggaeton|edm|progressive_house|progressive|house|love_songs|forr[oó]|sertanejo|funk|trap|pop|rock|flac|wav|mp3|songs)\b/gi;

            if (fileNameBase.startsWith('Album_')) {
                let withoutPrefix = fileNameBase.substring(6);
                if (withoutPrefix.toLowerCase().startsWith('love_songs')) {
                    albumName = 'Álbum Love Songs';
                    let remainder = withoutPrefix.substring(10).replace(/^_+/, '');
                    remainder = remainder.replace(/^\d{2}_*/, '');
                    cleanTitle = remainder.replace(styleRegex, '').replace(/_/g, ' ').trim();
                } else {
                    const trackNumMatch = withoutPrefix.match(/_(\d{2})_/);
                    if (trackNumMatch) {
                        const idx = withoutPrefix.indexOf(trackNumMatch[0]);
                        let albumKeyRaw = withoutPrefix.substring(0, idx);
                        albumName = 'Álbum ' + albumKeyRaw.replace(/_/g, ' ').trim();
                        let remainder = withoutPrefix.substring(idx + trackNumMatch[0].length);
                        remainder = remainder.replace(styleRegex, '');
                        remainder = remainder.replace(/_/g, ' ').trim();
                        if (remainder) cleanTitle = remainder;
                    } else {
                        const parts = withoutPrefix.split('_');
                        if (parts.length > 0) {
                            albumName = 'Álbum ' + parts[0];
                            let remainder = parts.slice(1).join(' ').replace(styleRegex, '').trim();
                            if (remainder) cleanTitle = remainder;
                        }
                    }
                }
            } else {
                cleanTitle = fileNameBase.replace(styleRegex, '').replace(/_/g, ' ').trim();
            }

            cleanTitle = cleanTitle.replace(/^(frozen|shortwave|teu caminho|love songs|forr[oó]|gospel|reggaeton|edm|progressive house)\s*/i, '');
            cleanTitle = cleanTitle.replace(/^\d{2}\s*/, '');
            cleanTitle = cleanTitle.replace(styleRegex, '').trim();
            
            if (!cleanTitle || cleanTitle.length < 2) {
                cleanTitle = fileNameBase.replace(/_/g, ' ');
            }

            return { title: cleanTitle, album: albumName };
        }

        async function fetchArchiveData() {
            try {
                const response = await fetch(`https://archive.org/metadata/${ARCHIVE_IDENTIFIER}`);
                const data = await response.json();
                const server = data.server;
                const dir = data.dir;
                const files = data.files || [];

                const seenNames = new Set();
                const audioFiles = files.filter(f => {
                    if (!f.name || !f.name.toLowerCase().endsWith('.mp3')) return false;
                    const base = f.name.toLowerCase();
                    if (seenNames.has(base)) return false;
                    seenNames.add(base);
                    return true;
                });

                const imageFiles = files.filter(f => f.name && (f.name.endsWith('.jpg') || f.name.endsWith('.png') || f.name.endsWith('.jpeg')));

                archiveTracks = audioFiles.map((file, idx) => {
                    const fileName = file.name;
                    const baseName = fileName.replace(/\.[^/.]+$/, "");
                    const audioUrl = `https://${server}${dir}/${fileName}`;
                    let coverUrl = 'icon.png';
                    const parsed = cleanTrackTitleAndAlbum(baseName);

                    if (baseName.startsWith('Album_')) {
                        const parts = baseName.split('_');
                        if (parts.length >= 2) {
                            const albumKey = parts[1];
                            const matchAlbumCover = imageFiles.find(img => img.name.toLowerCase().includes(`album_${albumKey.toLowerCase()}`));
                            if (matchAlbumCover) coverUrl = `https://${server}${dir}/${matchAlbumCover.name}`;
                        }
                    } else {
                        const exactMatchImg = imageFiles.find(img => img.name.replace(/\.[^/.]+$/, "").toLowerCase() === baseName.toLowerCase());
                        if (exactMatchImg) coverUrl = `https://${server}${dir}/${exactMatchImg.name}`;
                    }

                    const trackId = 'arc-' + idx;
                    return {
                        id: trackId,
                        title: parsed.title,
                        album: parsed.album,
                        artist: 'NaldoA',
                        cover: coverUrl,
                        audio: audioUrl,
                        likes: likesDb[trackId] || (1500 + (idx * 130)),
                        liked: !!likesDb[trackId + '_liked'],
                        isLocal: false
                    };
                });

                mergeAndShuffleTracks(false);
            } catch (err) {
                loadFallbackTracks();
            }
        }

        function loadFallbackTracks() {
            archiveTracks = [
                { id: 'f1', title: 'Sem Você Aqui', album: 'Álbum Falta Você', artist: 'NaldoA', cover: 'icon.png', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', likes: 1850, liked: false, isLocal: false }
            ];
            mergeAndShuffleTracks(false);
        }

        function mergeAndShuffleTracks(andPlay = true) {
            const formattedLocal = localTracks.map(t => ({ ...t, artist: 'NaldoA', isLocal: true }));
            tracks = [...formattedLocal, ...archiveTracks];

            for (let i = tracks.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [tracks[i], tracks[j]] = [tracks[j], tracks[i]];
            }
            updateModalCounts();
            renderFeed();
            setupIntersectionObserver();
            if (andPlay && tracks.length > 0) playTrackIndex(0);
            else if (tracks.length > 0 && currentPlayingIndex === -1) playTrackIndex(0);
        }

        function shuffleTracks() { mergeAndShuffleTracks(true); }

        function updateModalCounts() {
            const cArch = document.getElementById('count-archive');
            const cLoc = document.getElementById('count-local');
            if (cArch) cArch.innerText = archiveTracks.length;
            if (cLoc) cLoc.innerText = localTracks.length;
        }

        function switchModalTab(tab) {
            currentModalTab = tab;
            const btnArch = document.getElementById('tab-archive');
            const btnLoc = document.getElementById('tab-local');
            const uploadSec = document.getElementById('upload-section');

            if (tab === 'archive') {
                btnArch.className = 'py-2 rounded-lg text-xs font-bold transition bg-cyan-600 text-white shadow';
                btnLoc.className = 'py-2 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white';
                uploadSec.classList.add('hidden');
                uploadSec.classList.remove('flex');
            } else {
                btnLoc.className = 'py-2 rounded-lg text-xs font-bold transition bg-fuchsia-600 text-white shadow';
                btnArch.className = 'py-2 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white';
                uploadSec.classList.remove('hidden');
                uploadSec.classList.add('flex');
            }
            renderModalTracksList();
        }

        function renderModalTracksList() {
            const container = document.getElementById('modal-tracks-list');
            const list = currentModalTab === 'archive' ? archiveTracks : localTracks;

            if (list.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">Nenhuma música encontrada.</p>`;
                return;
            }

            container.innerHTML = list.map((t) => {
                const globalIdx = tracks.findIndex(x => x.id === t.id);
                const isPlaying = globalIdx === currentPlayingIndex;

                return `
                    <div class="flex items-center justify-between bg-white/5 border ${isPlaying ? 'border-cyan-400 bg-cyan-950/30' : 'border-white/15'} p-2.5 rounded-xl hover:bg-white/10 transition">
                        <div class="flex items-center space-x-3 truncate cursor-pointer flex-1" onclick="playTrackFromModal('${t.id}')">
                            <img src="${t.cover}" alt="Capa" class="w-10 h-10 rounded-lg object-cover bg-slate-950 flex-shrink-0" onerror="this.src='icon.png'">
                            <div class="truncate">
                                <h4 class="text-xs font-bold ${isPlaying ? 'text-cyan-300' : 'text-white'} truncate">${t.title}</h4>
                                <div class="flex items-center space-x-1.5 mt-0.5">
                                    <span class="text-[9px] font-black px-1.5 py-0.5 rounded ${t.isLocal ? 'bg-fuchsia-950 text-fuchsia-300' : 'bg-cyan-950 text-cyan-300'}">
                                        ${t.isLocal ? 'LOCAL' : 'NALDOA MUSIC'}
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1">
                            <button onclick="playTrackFromModal('${t.id}')" class="p-2 text-cyan-400 hover:text-cyan-300 text-xs">
                                <i class="fa-solid ${isPlaying ? 'fa-pause' : 'fa-play'}"></i>
                            </button>
                            ${t.isLocal ? `
                                <button onclick="removeLocalTrack('${t.id}')" class="p-2 text-slate-400 hover:text-red-400 text-xs">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function playTrackFromModal(trackId) {
            const index = tracks.findIndex(t => t.id === trackId);
            if (index !== -1) {
                closeLocalManagerModal();
                playTrackIndex(index, true);
            }
        }

        function renderFeed() {
            const root = document.getElementById('feed-root');
            if (tracks.length === 0) {
                root.innerHTML = `<div class="w-full h-full flex flex-col items-center justify-center space-y-4 text-slate-300 p-6 text-center">
                    <i class="fa-solid fa-music text-5xl text-cyan-400"></i>
                    <p class="text-sm font-semibold">Nenhuma música encontrada.</p>
                </div>`;
                return;
            }

            root.innerHTML = tracks.map((track, index) => `
                <div class="feed-card w-full relative overflow-hidden bg-slate-950 flex flex-col justify-between" id="card-${index}">
                    <div class="absolute inset-0 bg-cover bg-center bg-no-repeat w-full h-full" style="background-image: url('${track.cover}')"></div>
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/30 to-black/30 pointer-events-none"></div>

                    <div class="absolute inset-0 z-10 cursor-pointer" onclick="togglePlayPause()"></div>

                    <div class="absolute right-4 bottom-28 z-30 flex flex-col items-center space-y-4 pointer-events-auto">
                        <a href="https://open.spotify.com/intl-pt/artist/05anJA6CE7Afkn0hYyVMRV?si=Zd7SFNN9S9GQWUNWT6pW5g" target="_blank" title="Spotify" class="w-12 h-12 rounded-full bg-emerald-500 text-white flex items-center justify-center text-lg shadow-2xl hover:scale-110 transition border-2 border-emerald-300">
                            <i class="fa-brands fa-spotify"></i>
                        </a>

                        <a href="https://youtube.com/@naldoamusic?si=QfuYtlOQ1rrIZzKU" target="_blank" title="YouTube" class="w-12 h-12 rounded-full bg-red-600 text-white flex items-center justify-center text-lg shadow-2xl hover:scale-110 transition border-2 border-red-300">
                            <i class="fa-brands fa-youtube"></i>
                        </a>

                        <button onclick="toggleLike('${track.id}', ${index})" class="flex flex-col items-center group cursor-pointer">
                            <div class="w-12 h-12 rounded-full bg-slate-900/90 border border-white/30 flex items-center justify-center text-base shadow-2xl group-hover:scale-110 transition ${track.liked ? 'text-red-500 bg-red-500/20' : 'text-white'}">
                                <i class="fa-${track.liked ? 'solid' : 'regular'} fa-heart"></i>
                            </div>
                            <span class="text-xs font-black mt-1 text-white drop-shadow-md" id="likes-count-${index}">${track.likes}</span>
                        </button>

                        <button onclick="openCommentsModal('${track.id}')" class="flex flex-col items-center group cursor-pointer">
                            <div class="w-12 h-12 rounded-full bg-slate-900/90 border border-white/30 flex items-center justify-center text-sm shadow-2xl group-hover:scale-110 transition text-white">
                                <i class="fa-solid fa-comment-dots"></i>
                            </div>
                            <span class="text-xs font-black mt-1 text-white drop-shadow-md">${(commentsDb[track.id] || []).length}</span>
                        </button>

                        <button onclick="shareApp()" class="flex flex-col items-center group cursor-pointer" title="Compartilhar App">
                            <div class="w-12 h-12 rounded-full bg-slate-900/90 border border-white/30 flex items-center justify-center text-sm shadow-2xl group-hover:scale-110 transition text-white">
                                <i class="fa-solid fa-share"></i>
                            </div>
                            <span class="text-xs font-black mt-1 text-white drop-shadow-md">Share</span>
                        </button>
                    </div>

                    <div class="relative z-20 h-20 pointer-events-none"></div>

                    <div class="relative z-20 flex flex-col space-y-2 pb-5 px-4 w-full pointer-events-auto bg-gradient-to-t from-slate-950 via-slate-950/80 to-transparent pt-8">
                        <div class="w-full">
                            <div class="w-full h-1 bg-white/30 overflow-hidden cursor-pointer relative rounded-full" onclick="seekAudio(event, ${index})">
                                <div id="progress-bar-${index}" class="h-full bg-gradient-to-r from-cyan-400 to-fuchsia-500 w-0 transition-all duration-100 rounded-full"></div>
                            </div>
                        </div>

                        <div class="flex justify-between text-xs text-slate-300 font-bold">
                            <span id="progress-time-${index}">0:00 / 0:00</span>
                            <span class="text-cyan-300 font-extrabold uppercase tracking-wider">${track.album} ${track.isLocal ? '(Offline)' : ''}</span>
                        </div>

                        <div class="flex items-end justify-between pr-14">
                            <h2 class="text-2xl sm:text-3xl font-black text-white leading-tight drop-shadow-lg line-clamp-2">${track.title}</h2>
                        </div>
                    </div>

                    <div class="absolute bottom-1 left-1/2 transform -translate-x-1/2 z-20 flex flex-col items-center text-cyan-400 animate-bounce-up pointer-events-none" title="Deslize para cima">
                        <i class="fa-solid fa-chevron-up text-xs drop-shadow-md"></i>
                    </div>
                </div>
            `).join('');
        }

        function setupIntersectionObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const index = parseInt(entry.target.id.replace('card-', ''));
                        if (currentPlayingIndex !== index) {
                            playTrackIndex(index, false);
                        }
                    }
                });
            }, { threshold: 0.6 });

            tracks.forEach((_, idx) => {
                const card = document.getElementById(`card-${idx}`);
                if (card) observer.observe(card);
            });
        }

        function playTrackIndex(index, scrollToCard = true) {
            if (index < 0 || index >= tracks.length) return;
            currentPlayingIndex = index;
            const track = tracks[index];

            if (audioEl.src !== track.audio) {
                audioEl.src = track.audio;
                audioEl.play().catch(e => console.log('Autoplay guard:', e));
            }

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.title,
                    artist: 'NaldoA',
                    album: track.album,
                    artwork: [{ src: track.cover, sizes: '512x512', type: 'image/png' }]
                });
                navigator.mediaSession.setActionHandler('play', () => audioEl.play());
                navigator.mediaSession.setActionHandler('pause', () => audioEl.pause());
                navigator.mediaSession.setActionHandler('previoustrack', () => playPrevTrack());
                navigator.mediaSession.setActionHandler('nexttrack', () => playNextTrack());
            }

            if (scrollToCard) {
                const card = document.getElementById(`card-${index}`);
                if (card) card.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function togglePlayPause() {
            if (audioEl.paused) audioEl.play();
            else audioEl.pause();
        }

        function seekAudio(event, index) {
            if (index !== currentPlayingIndex) return;
            const rect = event.currentTarget.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const percent = clickX / rect.width;
            if (audioEl.duration) audioEl.currentTime = percent * audioEl.duration;
        }

        function playNextTrack() {
            let next = currentPlayingIndex + 1;
            if (next >= tracks.length) next = 0;
            playTrackIndex(next, true);
        }

        function playPrevTrack() {
            let prev = currentPlayingIndex - 1;
            if (prev < 0) prev = tracks.length - 1;
            playTrackIndex(prev, true);
        }

        function toggleLike(trackId, index) {
            const t = tracks.find(x => x.id === trackId);
            if (!t) return;
            t.liked = !t.liked;
            t.likes += t.liked ? 1 : -1;
            
            likesDb[trackId] = t.likes;
            likesDb[trackId + '_liked'] = t.liked;
            localStorage.setItem('naldoa_archive_likes', JSON.stringify(likesDb));
            
            const btn = document.querySelector(`#card-${index} .fa-heart`)?.parentElement;
            const countEl = document.getElementById(`likes-count-${index}`);
            if (btn) btn.className = `w-12 h-12 rounded-full border border-white/30 flex items-center justify-center text-base shadow-2xl transition ${t.liked ? 'text-red-500 bg-red-500/20' : 'text-white bg-slate-900/90'}`;
            if (countEl) countEl.innerText = t.likes;
        }

        function openCommentsModal(trackId) {
            activeCommentTrackId = trackId;
            renderCommentsList();
            document.getElementById('comments-modal').classList.remove('hidden');
            document.getElementById('comments-modal').classList.add('flex');
        }

        function closeCommentsModal() {
            document.getElementById('comments-modal').classList.remove('flex');
            document.getElementById('comments-modal').classList.add('hidden');
            activeCommentTrackId = null;
        }

        function renderCommentsList() {
            const container = document.getElementById('comments-list-container');
            const comments = commentsDb[activeCommentTrackId] || ['Som de altíssima qualidade!', 'NaldoA é brabo!'];
            container.innerHTML = comments.map(c => `<div class="bg-white/5 border border-white/10 p-3 rounded-xl text-xs text-slate-200"><p>${c}</p></div>`).join('');
        }

        function submitNewComment() {
            const input = document.getElementById('comment-input');
            const val = input.value.trim();
            if (!val || !activeCommentTrackId) return;

            if (!commentsDb[activeCommentTrackId]) commentsDb[activeCommentTrackId] = [];
            commentsDb[activeCommentTrackId].push(val);
            localStorage.setItem('naldoa_archive_comments', JSON.stringify(commentsDb));
            
            input.value = '';
            renderCommentsList();
            renderFeed();
            showToast('Comentário enviado!');
        }

        function shareApp() {
            const shareUrl = window.location.href;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(shareUrl).then(() => showToast('Link do NaldoA Music copiado!')).catch(() => fallbackCopy(shareUrl));
            } else {
                fallbackCopy(shareUrl);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try { document.execCommand('copy'); showToast('Link copiado!'); } catch (err) { showToast('Erro ao copiar.'); }
            document.body.removeChild(textArea);
        }

        function openLocalManagerModal() {
            updateModalCounts();
            switchModalTab('archive');
            document.getElementById('local-manager-modal').classList.remove('hidden');
            document.getElementById('local-manager-modal').classList.add('flex');
        }

        function closeLocalManagerModal() {
            document.getElementById('local-manager-modal').classList.remove('flex');
            document.getElementById('local-manager-modal').classList.add('hidden');
        }

        function handleDeviceAudioUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            Array.from(files).forEach((file, idx) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const audioBase64Url = e.target.result;
                    const baseName = file.name.replace(/\.[^/.]+$/, "");
                    const parsed = cleanTrackTitleAndAlbum(baseName);
                    const trackId = 'local-' + Date.now() + '-' + idx;

                    const newTrack = {
                        id: trackId,
                        title: parsed.title,
                        album: 'Minhas Músicas Offline',
                        artist: 'NaldoA',
                        cover: 'icon.png',
                        audio: audioBase64Url,
                        likes: 1,
                        liked: false,
                        isLocal: true
                    };

                    localTracks.push(newTrack);
                    localStorage.setItem('naldoa_local_tracks_offline', JSON.stringify(localTracks));
                    updateModalCounts();
                    renderModalTracksList();
                    mergeAndShuffleTracks(false);
                    showToast('Música salva offline com sucesso!');
                };
                reader.readAsDataURL(file);
            });
        }

        function removeLocalTrack(trackId) {
            localTracks = localTracks.filter(t => t.id !== trackId);
            localStorage.setItem('naldoa_local_tracks_offline', JSON.stringify(localTracks));
            updateModalCounts();
            renderModalTracksList();
            mergeAndShuffleTracks(false);
            showToast('Música removida.');
        }
    </script>
</body>
</html>
