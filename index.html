<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NaldoA Music</title>
    
    <!-- PWA Manifest apontando para icon.png na raiz -->
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22NaldoA%20Music%22%2C%22short_name%22%3A%22NaldoA%22%2C%22start_url%22%3A%22%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23030305%22%2C%22theme_color%22%3A%22%2306b6d4%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22icon.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%7D%2C%7B%22src%22%3A%22icon.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">
    <meta name="theme-color" content="#030305">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Favicon Local Exato -->
    <link rel="icon" type="image/png" href="icon.png" onerror="this.href='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=128&auto=format&fit=crop'">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030305;
            color: #f8fafc;
            user-select: none;
            overflow: hidden;
            touch-action: pan-y;
        }
        .glass {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-btn {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .feed-container {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: 100vh;
            scroll-behavior: smooth;
        }
        .feed-card {
            scroll-snap-align: start;
            height: 100vh;
            position: relative;
        }
        ::-webkit-scrollbar { display: none; }
        
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.04); }
        }
        .bg-glow {
            animation: pulseGlow 6s ease-in-out infinite;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative bg-slate-950">

    <header class="absolute top-0 inset-x-0 z-40 h-[56px] px-4 flex items-center justify-between glass border-b border-white/10 max-w-md mx-auto shadow-xl pt-1">
        <div class="flex items-center space-x-2.5">
            <div class="w-8 h-8 rounded-xl overflow-hidden shadow-md border border-cyan-500/40 flex-shrink-0 bg-slate-900">
                <img src="icon.png" alt="NaldoA Logo" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=200&auto=format&fit=crop'">
            </div>
            <div class="truncate leading-tight">
                <h1 class="font-extrabold text-[12px] tracking-wide text-white truncate block">NaldoA Music</h1>
                <a href="https://naldoa-dm.web.app" target="_blank" class="text-[9px] text-cyan-300 font-medium hover:underline block truncate">naldoa-dm.web.app</a>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="shuffleTracks()" title="Aleatório" class="w-7 h-7 rounded-xl bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 border border-indigo-500/40 flex items-center justify-center transition shadow text-xs">
                <i class="fa-solid fa-shuffle"></i>
            </button>
            <button onclick="openLocalManagerModal()" title="Minhas Músicas Offline" class="px-2.5 h-7 bg-gradient-to-r from-cyan-500 to-fuchsia-600 hover:opacity-90 text-white rounded-xl text-[10px] font-bold shadow transition flex items-center space-x-1.5">
                <i class="fa-solid fa-cloud-arrow-down text-[9px]"></i>
                <span>Minhas Músicas</span>
            </button>
        </div>
    </header>

    <main id="feed-root" class="feed-container w-full max-w-md bg-slate-950 relative shadow-2xl overflow-y-scroll" 
          onmousedown="startDrag(event)" onmousemove="onDrag(event)" onmouseup="endDrag()" onmouseleave="endDrag()"
          ontouchstart="startTouch(event)" ontouchend="endTouch()">
        <div class="w-full h-full flex flex-col items-center justify-center space-y-4 text-slate-400 p-6 text-center">
            <i class="fa-solid fa-compact-disc fa-spin text-5xl text-cyan-400"></i>
            <p class="text-xs font-semibold tracking-wide">Carregando acervo oficial...</p>
        </div>
    </main>

    <div id="toast-notification" class="fixed top-16 left-1/2 transform -translate-x-1/2 z-50 bg-slate-900/95 border border-cyan-500/40 text-white px-4 py-2 rounded-2xl shadow-2xl backdrop-blur-md text-xs font-semibold flex items-center space-x-2.5 transition-all duration-300 opacity-0 pointer-events-none">
        <i class="fa-solid fa-circle-check text-cyan-400 text-sm"></i>
        <span id="toast-message">Link copiado com sucesso!</span>
    </div>

    <div id="comments-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-end sm:items-center justify-center">
        <div class="glass w-full max-w-md sm:max-w-sm max-h-[80vh] rounded-t-3xl sm:rounded-2xl p-5 flex flex-col space-y-4 border border-white/20 shadow-2xl overflow-hidden">
            <div class="flex items-center justify-between border-b border-white/10 pb-3">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-comments text-cyan-400 text-lg"></i>
                    <h2 class="text-sm font-bold text-white">Comentários da Faixa</h2>
                </div>
                <button onclick="closeCommentsModal()" class="w-7 h-7 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center text-xs">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto space-y-2.5 pr-1 max-h-60" id="comments-list-container"></div>
            <div class="flex items-center space-x-2 pt-2 border-t border-white/10">
                <input type="text" id="comment-input" placeholder="Escreva seu comentário..." class="flex-1 bg-white/5 border border-white/15 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-cyan-400">
                <button onclick="submitNewComment()" class="px-4 py-2 bg-gradient-to-r from-cyan-500 to-fuchsia-600 hover:opacity-90 text-white rounded-xl text-xs font-bold shadow transition">
                    Enviar
                </button>
            </div>
        </div>
    </div>

    <div id="local-manager-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="glass w-full max-w-sm max-h-[85vh] rounded-2xl p-5 flex flex-col space-y-4 border border-white/20 shadow-2xl overflow-hidden">
            <div class="flex items-center justify-between border-b border-white/10 pb-3">
                <div class="flex items-center space-x-2">
                    <div class="w-7 h-7 rounded-lg overflow-hidden border border-cyan-500/40 bg-slate-900">
                        <img src="icon.png" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=100&auto=format&fit=crop'">
                    </div>
                    <h2 class="text-sm font-bold text-white">Músicas Offline (Sem Internet)</h2>
                </div>
                <button onclick="closeLocalManagerModal()" class="w-7 h-7 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center text-xs">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="flex flex-col space-y-2">
                <label class="w-full py-3 px-4 bg-gradient-to-r from-cyan-500 to-fuchsia-600 hover:opacity-90 text-white rounded-xl text-xs font-bold cursor-pointer shadow-lg transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-cloud-arrow-up text-sm"></i>
                    <span>Adicionar Músicas do Dispositivo</span>
                    <input type="file" accept="audio/*" multiple onchange="handleDeviceAudioUpload(event)" class="hidden">
                </label>
                <p class="text-[10px] text-slate-400 text-center">Suas músicas salvas rodam sem precisar de conexão!</p>
            </div>

            <div class="flex-1 overflow-y-auto space-y-2 pr-1" id="local-tracks-list"></div>
        </div>
    </div>

    <audio id="global-audio" preload="auto" playsinline></audio>

    <script>
        const ARCHIVE_IDENTIFIER = 'naldoa-digital-music-stream';
        let archiveTracks = [];
        let localTracks = JSON.parse(localStorage.getItem('naldoa_local_tracks_offline')) || [];
        let tracks = [];
        let commentsDb = JSON.parse(localStorage.getItem('naldoa_archive_comments')) || {};
        let likesDb = JSON.parse(localStorage.getItem('naldoa_archive_likes')) || {};
        let currentPlayingIndex = -1;
        let activeCommentTrackId = null;
        let audioEl = null;

        // Desktop mouse drag & mobile touch swipe support
        let isDragging = false;
        let startY = 0;
        let touchStartY = 0;

        function startDrag(e) {
            isDragging = true;
            startY = e.clientY;
        }

        function onDrag(e) {
            if (!isDragging) return;
            const deltaY = e.clientY - startY;
            if (Math.abs(deltaY) > 90) {
                if (deltaY < 0) {
                    playNextTrack();
                } else {
                    playPrevTrack();
                }
                isDragging = false;
            }
        }

        function endDrag() {
            isDragging = false;
        }

        function startTouch(e) {
            if (e.touches && e.touches.length > 0) {
                touchStartY = e.touches[0].clientY;
            }
        }

        function endTouch() {
            // standard scroll snap handles touch swipes
        }

        window.onload = async function() {
            audioEl = document.getElementById('global-audio');
            
            audioEl.onended = () => {
                playNextTrack();
            };

            audioEl.ontimeupdate = () => {
                if (!audioEl.duration) return;
                const percent = (audioEl.currentTime / audioEl.duration) * 100;
                const progressBar = document.getElementById(`progress-bar-${currentPlayingIndex}`);
                const progressTime = document.getElementById(`progress-time-${currentPlayingIndex}`);
                if (progressBar) progressBar.style.width = percent + '%';
                if (progressTime) progressTime.innerText = formatTime(audioEl.currentTime) + ' / ' + formatTime(audioEl.duration);
            };

            await fetchArchiveData();
        };

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        function showToast(message) {
            const toast = document.getElementById('toast-notification');
            const msgEl = document.getElementById('toast-message');
            msgEl.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        function cleanTrackTitleAndAlbum(fileNameBase) {
            let cleanTitle = fileNameBase;
            let albumName = 'NaldoA Beats';

            // Rigorous purging of genres, styles, rhythms and metadata tags
            const styleRegex = /_?(gospel|reggaeton|edm|progressive_house|progressive|house|love_songs|forr[oó]|sertanejo|funk|trap|pop|rock|flac|wav|mp3|songs)\b/gi;

            if (fileNameBase.startsWith('Album_')) {
                let withoutPrefix = fileNameBase.substring(6);
                const trackNumMatch = withoutPrefix.match(/_(\d{2})_/);
                if (trackNumMatch) {
                    const idx = withoutPrefix.indexOf(trackNumMatch[0]);
                    let albumKeyRaw = withoutPrefix.substring(0, idx);
                    albumName = 'Álbum ' + albumKeyRaw.replace(/_/g, ' ').trim();

                    let remainder = withoutPrefix.substring(idx + trackNumMatch[0].length);
                    remainder = remainder.replace(styleRegex, '');
                    remainder = remainder.replace(/_/g, ' ').trim();
                    if (remainder) cleanTitle = remainder;
                } else {
                    const parts = withoutPrefix.split('_');
                    if (parts.length > 0) {
                        albumName = 'Álbum ' + parts[0];
                        let remainder = parts.slice(1).join(' ').replace(styleRegex, '').trim();
                        if (remainder) cleanTitle = remainder;
                    }
                }
            } else {
                cleanTitle = fileNameBase.replace(styleRegex, '').replace(/_/g, ' ').trim();
            }

            cleanTitle = cleanTitle.replace(/^(frozen|shortwave|teu caminho|love songs|forr[oó]|gospel|reggaeton|edm|progressive house)\s*/i, '');
            cleanTitle = cleanTitle.replace(/^\d{2}\s*/, '');
            cleanTitle = cleanTitle.replace(styleRegex, '').trim();
            
            if (!cleanTitle || cleanTitle.length < 2) {
                cleanTitle = fileNameBase.replace(/_/g, ' ');
            }

            return { title: cleanTitle, album: albumName };
        }

        async function fetchArchiveData() {
            try {
                const response = await fetch(`https://archive.org/metadata/${ARCHIVE_IDENTIFIER}`);
                const data = await response.json();
                
                const server = data.server;
                const dir = data.dir;
                const files = data.files || [];

                const audioFiles = files.filter(f => f.name && (f.name.endsWith('.mp3') || f.name.endsWith('.wav') || f.name.endsWith('.flac')));
                const imageFiles = files.filter(f => f.name && (f.name.endsWith('.jpg') || f.name.endsWith('.png') || f.name.endsWith('.jpeg')));

                archiveTracks = audioFiles.map((file, idx) => {
                    const fileName = file.name;
                    const baseName = fileName.replace(/\.[^/.]+$/, "");
                    const audioUrl = `https://${server}${dir}/${fileName}`;
                    
                    let coverUrl = 'icon.png';
                    
                    const parsed = cleanTrackTitleAndAlbum(baseName);
                    let cleanTitle = parsed.title;
                    let albumName = parsed.album;

                    if (baseName.startsWith('Album_')) {
                        const parts = baseName.split('_');
                        if (parts.length >= 2) {
                            const albumKey = parts[1];
                            const matchAlbumCover = imageFiles.find(img => {
                                const imgNameL = img.name.toLowerCase();
                                return imgNameL.includes(`album_${albumKey.toLowerCase()}`);
                            });
                            if (matchAlbumCover) {
                                coverUrl = `https://${server}${dir}/${matchAlbumCover.name}`;
                            }
                        }
                    } else {
                        const exactMatchImg = imageFiles.find(img => img.name.replace(/\.[^/.]+$/, "").toLowerCase() === baseName.toLowerCase());
                        if (exactMatchImg) {
                            coverUrl = `https://${server}${dir}/${exactMatchImg.name}`;
                        }
                    }

                    const trackId = 'arc-' + idx;
                    return {
                        id: trackId,
                        title: cleanTitle,
                        album: albumName,
                        artist: 'NaldoA',
                        cover: coverUrl,
                        audio: audioUrl,
                        likes: likesDb[trackId] || (1500 + (idx * 130)),
                        liked: !!likesDb[trackId + '_liked'],
                        isLocal: false
                    };
                });

                mergeAndShuffleTracks(false);

            } catch (err) {
                console.log('Erro ao carregar Archive, usando fallback:', err);
                loadFallbackTracks();
            }
        }

        function loadFallbackTracks() {
            archiveTracks = [
                { id: 'f1', title: 'Sem Você Aqui', album: 'Álbum Falta Você', artist: 'NaldoA', cover: 'icon.png', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', likes: 1850, liked: false, isLocal: false }
            ];
            mergeAndShuffleTracks(false);
        }

        function mergeAndShuffleTracks(andPlay = true) {
            const formattedLocal = localTracks.map(t => ({
                ...t,
                artist: 'NaldoA',
                isLocal: true
            }));
            tracks = [...formattedLocal, ...archiveTracks];

            for (let i = tracks.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [tracks[i], tracks[j]] = [tracks[j], tracks[i]];
            }
            renderFeed();
            setupIntersectionObserver();
            if (andPlay && tracks.length > 0) {
                playTrackIndex(0);
            } else if (tracks.length > 0 && currentPlayingIndex === -1) {
                playTrackIndex(0);
            }
        }

        function shuffleTracks() {
            mergeAndShuffleTracks(true);
        }

        function renderFeed() {
            const root = document.getElementById('feed-root');
            if (tracks.length === 0) {
                root.innerHTML = `<div class="w-full h-full flex flex-col items-center justify-center space-y-4 text-slate-400 p-6 text-center">
                    <i class="fa-solid fa-music text-5xl text-cyan-400"></i>
                    <p class="text-xs font-semibold">Nenhuma música encontrada.</p>
                </div>`;
                return;
            }

            root.innerHTML = tracks.map((track, index) => `
                <div class="feed-card w-full h-full flex flex-col justify-between pt-[56px] pb-4 px-3 relative overflow-hidden bg-slate-950" id="card-${index}">
                    <!-- Immersive Full-Screen Edge-to-Edge Cover Art -->
                    <div class="absolute inset-0 bg-cover bg-center filter blur-3xl opacity-65 scale-125 bg-glow" style="background-image: url('${track.cover}')"></div>
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-slate-950/40"></div>

                    <!-- Full Screen Cover Center (Edge-to-Edge) -->
                    <div class="relative z-10 flex-1 flex flex-col items-center justify-center my-auto w-full h-full max-h-[85vh]" onclick="togglePlayPause()">
                        <div class="relative w-full h-full flex items-center justify-center group cursor-pointer overflow-hidden rounded-2xl shadow-2xl bg-black/40">
                            <img src="${track.cover}" alt="${track.title}" class="w-full h-full object-cover transition duration-500" onerror="this.src='icon.png'">
                            
                            <div class="absolute inset-0 bg-black/30 backdrop-blur-[2px] flex items-center justify-center opacity-0 group-hover:opacity-100 transition duration-300">
                                <div class="w-16 h-16 rounded-full bg-cyan-500/90 text-white flex items-center justify-center shadow-2xl transform scale-90 group-hover:scale-100 transition">
                                    <i id="center-play-icon-${index}" class="fa-solid ${currentPlayingIndex === index && !audioEl.paused ? 'fa-pause' : 'fa-play'} text-2xl"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Absolute Floating Social Buttons (TikTok Style on Right) -->
                    <div class="absolute right-4 bottom-24 z-30 flex flex-col items-center space-y-3.5 pointer-events-auto">
                        <a href="https://open.spotify.com/intl-pt/artist/05anJA6CE7Afkn0hYyVMRV?si=Zd7SFNN9S9GQWUNWT6pW5g" target="_blank" title="Spotify" class="w-10 h-10 rounded-full bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 flex items-center justify-center text-sm shadow-xl hover:scale-110 transition">
                            <i class="fa-brands fa-spotify"></i>
                        </a>

                        <a href="https://youtube.com/@naldoamusic?si=QfuYtlOQ1rrIZzKU" target="_blank" title="YouTube" class="w-10 h-10 rounded-full bg-red-500/20 border border-red-500/40 text-red-400 flex items-center justify-center text-sm shadow-xl hover:scale-110 transition">
                            <i class="fa-brands fa-youtube"></i>
                        </a>

                        <button onclick="toggleLike('${track.id}', ${index})" class="flex flex-col items-center group cursor-pointer">
                            <div class="w-10 h-10 rounded-full glass-btn flex items-center justify-center text-sm shadow-xl group-hover:scale-110 transition ${track.liked ? 'text-red-500 bg-red-500/20' : 'text-white'}">
                                <i class="fa-${track.liked ? 'solid' : 'regular'} fa-heart"></i>
                            </div>
                            <span class="text-[10px] font-extrabold mt-1 text-white drop-shadow-md" id="likes-count-${index}">${track.likes}</span>
                        </button>

                        <button onclick="openCommentsModal('${track.id}')" class="flex flex-col items-center group cursor-pointer">
                            <div class="w-10 h-10 rounded-full glass-btn flex items-center justify-center text-xs shadow-xl group-hover:scale-110 transition text-white">
                                <i class="fa-solid fa-comment-dots"></i>
                            </div>
                            <span class="text-[10px] font-extrabold mt-1 text-white drop-shadow-md">${(commentsDb[track.id] || []).length}</span>
                        </button>

                        <button onclick="shareApp()" class="flex flex-col items-center group cursor-pointer" title="Compartilhar App">
                            <div class="w-10 h-10 rounded-full glass-btn flex items-center justify-center text-xs shadow-xl group-hover:scale-110 transition text-white">
                                <i class="fa-solid fa-share"></i>
                            </div>
                            <span class="text-[10px] font-extrabold mt-1 text-white drop-shadow-md">Share</span>
                        </button>
                    </div>

                    <!-- Bottom Info & Interactive Progress Bar -->
                    <div class="relative z-20 flex flex-col space-y-1.5 pb-1 pr-16">
                        <div class="w-full space-y-1">
                            <div class="w-full h-1.5 bg-white/20 rounded-full overflow-hidden cursor-pointer relative" onclick="seekAudio(event, ${index})">
                                <div id="progress-bar-${index}" class="h-full bg-gradient-to-r from-cyan-400 to-fuchsia-500 w-0 transition-all duration-100"></div>
                            </div>
                            <div class="flex justify-between text-[10px] text-slate-300 font-medium px-0.5">
                                <span id="progress-time-${index}">0:00 / 0:00</span>
                                <span class="text-cyan-400 font-bold">${track.album} ${track.isLocal ? '(Offline)' : ''}</span>
                            </div>
                        </div>

                        <div class="space-y-0.5">
                            <div class="flex items-center space-x-1.5">
                                <span class="text-[10px] text-slate-300 font-semibold flex items-center space-x-1" id="status-label-${index}">
                                    <i class="fa-solid fa-volume-high text-cyan-400 animate-pulse text-[9px]"></i>
                                    <span>Tocando Agora</span>
                                </span>
                            </div>
                            <h2 class="text-sm sm:text-base font-extrabold text-white leading-tight drop-shadow-lg line-clamp-2">${track.title}</h2>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function setupIntersectionObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const index = parseInt(entry.target.id.replace('card-', ''));
                        if (currentPlayingIndex !== index) {
                            playTrackIndex(index, false);
                        }
                    }
                });
            }, { threshold: 0.6 });

            tracks.forEach((_, idx) => {
                const card = document.getElementById(`card-${idx}`);
                if (card) observer.observe(card);
            });
        }

        function playTrackIndex(index, scrollToCard = true) {
            if (index < 0 || index >= tracks.length) return;
            currentPlayingIndex = index;
            const track = tracks[index];

            tracks.forEach((_, i) => {
                const lbl = document.getElementById(`status-label-${i}`);
                const centerIcon = document.getElementById(`center-play-icon-${i}`);
                if (lbl) lbl.innerHTML = (i === index) ? `<i class="fa-solid fa-volume-high text-cyan-400 animate-pulse text-[9px]"></i><span>Tocando Agora</span>` : '';
                if (centerIcon) {
                    centerIcon.className = `fa-solid ${(i === index && !audioEl.paused) ? 'fa-pause' : 'fa-play'} text-2xl`;
                }
            });

            audioEl.src = track.audio;
            audioEl.play().catch(e => {
                console.log('Aguardando interação:', e);
            });

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.title,
                    artist: 'NaldoA',
                    album: track.album,
                    artwork: [
                        { src: track.cover, sizes: '512x512', type: 'image/png' }
                    ]
                });

                navigator.mediaSession.setActionHandler('play', () => { audioEl.play(); updatePlayStates(); });
                navigator.mediaSession.setActionHandler('pause', () => { audioEl.pause(); updatePlayStates(); });
                navigator.mediaSession.setActionHandler('previoustrack', () => { playPrevTrack(); });
                navigator.mediaSession.setActionHandler('nexttrack', () => { playNextTrack(); });
            }

            if (scrollToCard) {
                const card = document.getElementById(`card-${index}`);
                if (card) card.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function togglePlayPause() {
            if (audioEl.paused) {
                audioEl.play();
            } else {
                audioEl.pause();
            }
            updatePlayStates();
        }

        function updatePlayStates() {
            const centerIcon = document.getElementById(`center-play-icon-${currentPlayingIndex}`);
            if (centerIcon) {
                centerIcon.className = `fa-solid ${audioEl.paused ? 'fa-play' : 'fa-pause'} text-2xl`;
            }
        }

        function seekAudio(event, index) {
            if (index !== currentPlayingIndex) return;
            const rect = event.currentTarget.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const width = rect.width;
            const percent = clickX / width;
            if (audioEl.duration) {
                audioEl.currentTime = percent * audioEl.duration;
            }
        }

        function playNextTrack() {
            let next = currentPlayingIndex + 1;
            if (next >= tracks.length) next = 0;
            playTrackIndex(next, true);
        }

        function playPrevTrack() {
            let prev = currentPlayingIndex - 1;
            if (prev < 0) prev = tracks.length - 1;
            playTrackIndex(prev, true);
        }

        function toggleLike(trackId, index) {
            const t = tracks.find(x => x.id === trackId);
            if (!t) return;
            t.liked = !t.liked;
            t.likes += t.liked ? 1 : -1;
            
            likesDb[trackId] = t.likes;
            likesDb[trackId + '_liked'] = t.liked;
            localStorage.setItem('naldoa_archive_likes', JSON.stringify(likesDb));
            
            const btnIcon = document.querySelector(`#card-${index} .fa-heart`);
            const countEl = document.getElementById(`likes-count-${index}`);
            if (btnIcon) {
                btnIcon.className = t.liked ? 'fa-solid fa-heart text-red-500' : 'fa-regular fa-heart';
            }
            if (countEl) countEl.innerText = t.likes;
        }

        function openCommentsModal(trackId) {
            activeCommentTrackId = trackId;
            renderCommentsList();
            document.getElementById('comments-modal').classList.remove('hidden');
            document.getElementById('comments-modal').classList.add('flex');
        }

        function closeCommentsModal() {
            document.getElementById('comments-modal').classList.remove('flex');
            document.getElementById('comments-modal').classList.add('hidden');
            activeCommentTrackId = null;
        }

        function renderCommentsList() {
            const container = document.getElementById('comments-list-container');
            const comments = commentsDb[activeCommentTrackId] || ['Produção impecável!', 'Som de alta qualidade!'];
            
            container.innerHTML = comments.map(c => `
                <div class="bg-white/5 border border-white/10 p-2.5 rounded-xl text-xs text-slate-200">
                    <p>${c}</p>
                </div>
            `).join('');
        }

        function submitNewComment() {
            const input = document.getElementById('comment-input');
            const val = input.value.trim();
            if (!val || !activeCommentTrackId) return;

            if (!commentsDb[activeCommentTrackId]) commentsDb[activeCommentTrackId] = [];
            commentsDb[activeCommentTrackId].push(val);
            localStorage.setItem('naldoa_archive_comments', JSON.stringify(commentsDb));
            
            input.value = '';
            renderCommentsList();
            renderFeed();
            showToast('Comentário enviado!');
        }

        function shareApp() {
            const shareUrl = window.location.href;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    showToast('Link do NaldoA Music copiado com sucesso!');
                }).catch(() => {
                    fallbackCopy(shareUrl);
                });
            } else {
                fallbackCopy(shareUrl);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('Link copiado com sucesso!');
            } catch (err) {
                showToast('Erro ao copiar link.');
            }
            document.body.removeChild(textArea);
        }

        function openLocalManagerModal() {
            renderLocalTracksList();
            document.getElementById('local-manager-modal').classList.remove('hidden');
            document.getElementById('local-manager-modal').classList.add('flex');
        }

        function closeLocalManagerModal() {
            document.getElementById('local-manager-modal').classList.remove('flex');
            document.getElementById('local-manager-modal').classList.add('hidden');
        }

        function renderLocalTracksList() {
            const container = document.getElementById('local-tracks-list');
            if (localTracks.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">Nenhuma música offline adicionada ainda.</p>`;
                return;
            }

            container.innerHTML = localTracks.map((t) => `
                <div class="flex items-center justify-between bg-white/5 border border-white/10 p-2.5 rounded-xl hover:bg-white/10 transition">
                    <div class="flex items-center space-x-3 truncate cursor-pointer flex-1" onclick="playLocalTrackItem('${t.id}')">
                        <img src="${t.cover}" alt="Capa" class="w-10 h-10 rounded-lg object-cover bg-slate-900" onerror="this.src='icon.png'">
                        <div class="truncate">
                            <h4 class="text-xs font-bold text-white truncate">${t.title}</h4>
                            <p class="text-[10px] text-cyan-400">${t.album}</p>
                        </div>
                    </div>
                    <button onclick="removeLocalTrack('${t.id}')" class="text-slate-400 hover:text-red-400 p-2 text-xs">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            `).join('');
        }

        function handleDeviceAudioUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            Array.from(files).forEach((file, idx) => {
                const audioUrl = URL.createObjectURL(file);
                const baseName = file.name.replace(/\.[^/.]+$/, "");
                const parsed = cleanTrackTitleAndAlbum(baseName);
                const trackId = 'local-' + Date.now() + '-' + idx;

                const newTrack = {
                    id: trackId,
                    title: parsed.title,
                    album: 'Minhas Músicas Offline',
                    artist: 'NaldoA',
                    cover: 'icon.png',
                    audio: audioUrl,
                    likes: 1,
                    liked: false,
                    isLocal: true
                };

                localTracks.push(newTrack);
            });

            localStorage.setItem('naldoa_local_tracks_offline', JSON.stringify(localTracks));
            renderLocalTracksList();
            mergeAndShuffleTracks(true);
            showToast(`${files.length} música(s) adicionada(s) para ouvir offline!`);
        }

        function removeLocalTrack(trackId) {
            localTracks = localTracks.filter(t => t.id !== trackId);
            localStorage.setItem('naldoa_local_tracks_offline', JSON.stringify(localTracks));
            renderLocalTracksList();
            mergeAndShuffleTracks(false);
            showToast('Música removida.');
        }

        function playLocalTrackItem(trackId) {
            const index = tracks.findIndex(t => t.id === trackId);
            if (index !== -1) {
                closeLocalManagerModal();
                playTrackIndex(index, true);
            }
        }
    </script>
</body>
</html>
